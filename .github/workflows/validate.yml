
name: Validate Bicep

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep and validate
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep install
            az bicep version
            az bicep lint --file bicep/main.bicep
            az bicep build --file bicep/main.bicep

